<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全息成就卡 · E2Map · 蓝图</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: #0d0d1a; display: flex; justify-content: center; align-items: center; font-family: system-ui, sans-serif; }
.card-container { perspective: 1200px; cursor: pointer; }
.card { position: relative; width: 420px; height: 580px; border-radius: 18px; overflow: hidden; transform-style: preserve-3d; transition: transform 0.08s ease-out; box-shadow: 0 0 30px rgba(255,215,0,0.15), 0 25px 80px rgba(0,0,0,0.6); }
.card-inner { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; border: 3px solid #d4af37; background: #0B1A30; transform-style: preserve-3d; }
.card-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.foil-overlay { position: absolute; inset: 0; z-index: 2; opacity: 0; mix-blend-mode: color-dodge; transition: opacity 0.4s ease; pointer-events: none; background: repeating-linear-gradient(45deg, rgba(255,0,0,0.5) 0%, rgba(255,255,0,0.5) 8%, rgba(0,255,0,0.5) 16%, rgba(0,255,255,0.5) 24%, rgba(0,100,255,0.5) 32%, rgba(255,0,255,0.5) 40%, rgba(255,0,0,0.5) 50%); background-size: 300% 300%; animation: foilShift 3s ease-in-out infinite alternate; }
.card.hover-active .foil-overlay, .card:hover .foil-overlay { opacity: 0.6; }
@keyframes foilShift { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
.sparkle-overlay { position: absolute; inset: 0; z-index: 3; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
.card.hover-active .sparkle-overlay, .card:hover .sparkle-overlay { opacity: 1; }
.sparkle { position: absolute; width: 6px; height: 6px; background: white; border-radius: 50%; filter: blur(0.5px); box-shadow: 0 0 8px 3px rgba(255,255,255,0.8), 0 0 20px 6px rgba(255,215,0,0.3); }
.sparkle::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%); border-radius: 50%; }
.sparkle:nth-child(1) { top:8%; left:12%; animation:sparkle 2.0s ease-in-out infinite; }
.sparkle:nth-child(2) { top:20%; left:78%; animation:sparkle 2.5s ease-in-out infinite 0.3s; }
.sparkle:nth-child(3) { top:38%; left:22%; animation:sparkle 1.8s ease-in-out infinite 0.6s; }
.sparkle:nth-child(4) { top:55%; left:82%; animation:sparkle 2.8s ease-in-out infinite 0.9s; }
.sparkle:nth-child(5) { top:75%; left:28%; animation:sparkle 2.2s ease-in-out infinite 1.2s; }
.sparkle:nth-child(6) { top:30%; left:52%; animation:sparkle 3.0s ease-in-out infinite 0.4s; }
.sparkle:nth-child(7) { top:65%; left:68%; animation:sparkle 2.0s ease-in-out infinite 1.0s; }
.sparkle:nth-child(8) { top:12%; left:48%; animation:sparkle 2.6s ease-in-out infinite 0.1s; }
.sparkle:nth-child(9) { top:88%; left:60%; animation:sparkle 2.3s ease-in-out infinite 1.4s; }
.sparkle:nth-child(10) { top:45%; left:8%; animation:sparkle 2.9s ease-in-out infinite 0.5s; }
.sparkle:nth-child(11) { top:3%; left:88%; animation:sparkle 1.7s ease-in-out infinite 0.7s; }
.sparkle:nth-child(12) { top:70%; left:45%; animation:sparkle 2.1s ease-in-out infinite 1.1s; }
@keyframes sparkle { 0%,100% { opacity:0; transform:scale(0.3); } 40% { opacity:1; transform:scale(1.6); } 70% { opacity:0.5; transform:scale(0.8); } }
.border-shine { position: absolute; inset:-3px; z-index:4; border-radius:18px; border:3px solid transparent; background: linear-gradient(135deg,#d4af37,#fff4b0,#d4af37) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none; opacity:0; transition:opacity 0.3s ease; }
.card.hover-active .border-shine, .card:hover .border-shine { opacity:1; animation:borderPulse 2s ease-in-out infinite; }
@keyframes borderPulse { 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.6);} }
.shine { position:absolute; inset:0; z-index:5; pointer-events:none; background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.25) 40%, rgba(255,255,255,0.1) 48%, transparent 55%); opacity:0; transition:opacity 0.3s ease; }
.card.hover-active .shine, .card:hover .shine { opacity:1; animation:shineSweep 2.5s ease-in-out infinite; }
@keyframes shineSweep { 0%{transform:translateX(-120%) skewX(-15deg);} 50%{transform:translateX(250%) skewX(-15deg);} 100%{transform:translateX(-120%) skewX(-15deg);} }
.glass { position:absolute; inset:0; z-index:6; pointer-events:none; border-radius:16px; background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.18) 0%, transparent 70%); opacity:0; transition:opacity 0.2s ease; }
.card.hover-active .glass, .card:hover .glass { opacity:1; }
.rarity-badge { position:absolute; top:18px; right:18px; z-index:7; background:linear-gradient(135deg,#ffd700,#d4af37); color:#1a1a2e; padding:6px 16px; border-radius:20px; font-size:13px; font-weight:800; letter-spacing:1.5px; box-shadow:0 0 20px rgba(255,215,0,0.4); pointer-events:none; }
.card-title { position:absolute; bottom:16px; left:16px; right:16px; z-index:7; color:white; font-size:20px; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,0.9); padding:10px 14px; background:linear-gradient(transparent, rgba(0,0,0,0.7)); border-radius:0 0 14px 14px; pointer-events:none; }
.card-subtitle { font-size:13px; font-weight:400; opacity:0.8; margin-top:4px; }
.paper-tag { display:inline-block; background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); padding:3px 10px; border-radius:8px; font-size:11px; margin-top:6px; }
</style>
</head>
<body>

        <!-- Path waypoint nodes -->

</div>
<script>
const card = document.getElementById('card');
const glass = document.getElementById('glass');
card.addEventListener('mousemove', (e) => {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const cx = rect.width/2, cy = rect.height/2;
  card.style.transform = `rotateX(${((cy-y)/cy)*18}deg) rotateY(${((x-cx)/cx)*18}deg)`;
  glass.style.setProperty('--mx', `${(x/rect.width)*100}%`);
  glass.style.setProperty('--my', `${(y/rect.height)*100}%`);
});
card.addEventListener('mouseleave', () => {
  card.style.transform = 'rotateX(0deg) rotateY(0deg)';
});
</script>
</body>
