<title>Lottie 动画示例 · PaperLesson</title>

<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F7F4EE; color: #1A1A2E;
    -webkit-font-smoothing: antialiased;
    padding: 40px 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }
  h1 { font-family: 'Noto Serif SC', serif; font-size: 32px; font-weight: 900; margin-bottom: 4px; }
  h1 .a { color: #CC785C; }
  .sub { font-size: 14px; color: #5A5A6A; margin-bottom: 32px; line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .card {
    background: #FBFAF7; border: 1px solid #E8E4DC; border-radius: 14px;
    padding: 20px; display: flex; align-items: center; gap: 20px;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(26,26,46,0.08); }
  .anim-box {
    width: 100px; height: 100px; flex-shrink: 0;
    background: #F7F4EE; border-radius: 12px; overflow: hidden;
  }
  .anim-box .lottie-wrap { width: 100%; height: 100%; }
  .info { flex: 1; min-width: 0; }
  .info .label { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .info .label .e { margin-right: 6px; }
  .info .desc { font-size: 13px; color: #5A5A6A; line-height: 1.6; }
  .btn-row { text-align: center; margin-top: 28px; display: flex; gap: 12px; justify-content: center; }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .btn.primary { background: #CC785C; color: white; }
  .btn.primary:hover { background: #A85D42; }
  .btn.outline { background: transparent; color: #CC785C; border: 1px solid #CC785C; }
  .btn.outline:hover { background: rgba(204,120,92,0.08); }
  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .card { flex-direction: column; text-align: center; }
    .anim-box { width: 80px; height: 80px; }
  }
</style>
</head>

const ANIMS = [
  {id:"check-bounce", emoji:"✅", label:"对勾 — 弹入", desc:"从0放大弹入，overshoot 回弹，适合完成状态出现"},
  {id:"lightbulb-pulse", emoji:"💡", label:"灯泡 — 呼吸脉冲", desc:"透明度40%-100%循环，柔和呼吸感，适合提示/洞察"},
  {id:"gear-spin", emoji:"⚙️", label:"齿轮 — 旋转", desc:"0°→360°匀速旋转，适合加载/设置/机制"},
  {id:"target-ripple", emoji:"🎯", label:"目标 — 脉冲涟漪", desc:"外层圆圈周期缩放，适合定位/核心目标"},
  {id:"pin-bounce", emoji:"📌", label:"标记 — 弹跳", desc:"弹跳入场，适合页面新元素出现"},
  {id:"sparkle-twinkle", emoji:"✨", label:"亮点 — 闪烁", desc:"缩放+透明度交替变化，星星闪烁效果"},
  {id:"note-draw", emoji:"📝", label:"笔记 — 绘制", desc:"路径从0→100%逐渐画出，类似手写效果"},
  {id:"rocket-fly", emoji:"🚀", label:"进阶 — 飞入", desc:"从下方飞入+回弹，适合启动/升级场景"},
  {id:"link-pulse", emoji:"🔗", label:"链接 — 脉冲", desc:"周期性轻微缩放，表示可交互/可点击"},
  {id:"search-scan", emoji:"🔍", label:"搜索 — 扫描", desc:"左右摆动30°，模仿搜索扫描动效"},
];


const animInstances = {};

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = ANIMS.map(a => `
    <div class="card">
      <div class="anim-box">
        <div class="lottie-wrap" id="anim-$\{a.id}"></div>
      </div>
      <div class="info">
        <div class="label"><span class="e">$\{a.emoji}</span>$\{a.label}</div>
        <div class="desc">$\{a.desc}</div>
      </div>
    </div>
  `).join('');

  ANIMS.forEach(a => {
    const container = document.getElementById(`anim-${a.id}`);
    try {
      animInstances[a.id] = bodymovin.loadAnimation({
        container: container,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: ANIM_DATA[a.id],
      });
    } catch(e) {
      container.innerHTML = '<div style="padding:20px;color:#8A8A9A;font-size:12px;">加载失败</div>';
    }
  });
}

function playAll() { Object.values(animInstances).forEach(a => a.play()); }
function stopAll() { Object.values(animInstances).forEach(a => a.stop()); }
function restartAll() { Object.values(animInstances).forEach(a => { a.stop(); a.play(); }); }

window.addEventListener('DOMContentLoaded', buildGrid);
</script>
