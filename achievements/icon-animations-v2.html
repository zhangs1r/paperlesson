<title>PaperLesson · 全部图标绘制动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #F7F4EE; color: #1A1A2E;
    -webkit-font-smoothing: antialiased;
    padding: 40px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  h1 {
    font-family: 'Noto Serif SC', Georgia, serif;
    font-size: 28px; font-weight: 900; margin-bottom: 4px;
  }
  h1 .a { color: #CC785C; }
  .sub { font-size: 13px; color: #5A5A6A; margin-bottom: 28px; line-height: 1.7; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .card {
    background: #FBFAF7; border: 1px solid #E8E4DC; border-radius: 12px;
    padding: 16px; display: flex; align-items: center; gap: 14px;
    transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(26,26,46,0.08); }

  .icon-box {
    width: 60px; height: 60px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #F7F4EE; border-radius: 10px;
  }
  .icon-box svg { width: 40px; height: 40px; overflow: visible; }

  .info { flex: 1; min-width: 0; }
  .info .label { font-size: 13px; font-weight: 600; }
  .info .label .e { margin-right: 4px; font-size: 15px; }

  /* ── 按钮 ── */
  .btn-row { text-align: center; margin: 28px 0; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .btn.primary { background: #CC785C; color: white; }
  .btn.primary:hover { background: #A85D42; }
  .btn.outline { background: transparent; color: #CC785C; border: 1px solid #CC785C; }
  .btn.outline:hover { background: rgba(204,120,92,0.08); }

  @media (max-width: 700px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 450px) { .grid { grid-template-columns: 1fr; } }

  /* ── 全局动画关键帧 ── */

  /* 路径绘制：从遮挡到显示 */
  @keyframes drawStroke {
    0% { stroke-dashoffset: var(--dash, 200); }
    100% { stroke-dashoffset: 0; }
  }

  /* 填充淡入弹出 */
  @keyframes fillPop {
    0% { opacity: 0; transform: scale(0); }
    60% { opacity: 1; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }

<script>
function replayAll() {
  // 移除所有动画类，触发回流，再加回去
  const svgs = document.querySelectorAll('.icon-svg');
  svgs.forEach(svg => {
    svg.style.animation = 'none';
    svg.style.opacity = '0';
    svg.style.transform = 'scale(0.8)';
    // 重置所有 path
    const paths = svg.querySelectorAll('path');
    paths.forEach(p => {
      p.style.animation = 'none';
      // 触发回流
      void p.offsetWidth;
      p.style.animation = '';
    });
    void svg.offsetWidth;
    svg.style.animation = '';
  });
}
</script>
