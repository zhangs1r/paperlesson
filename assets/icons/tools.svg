<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
  <defs>
    <style>
      @keyframes draw { 0% { stroke-dashoffset:158; } 100% { stroke-dashoffset:0; } }
      @keyframes fpop { 0% { opacity:0; transform:scale(0); } 60% { opacity:1; transform:scale(1.2); } 100% { opacity:1; transform:scale(1); } }
      @keyframes bounce {
        0%   { transform:scale(1) rotate(0deg); }
        30%  { transform:scale(1.18) rotate(3deg); }
        55%  { transform:scale(0.92) rotate(-2deg); }
        78%  { transform:scale(1.06) rotate(1deg); }
        100% { transform:scale(1) rotate(0deg); }
      }
      .p0 { animation: draw 2.6333333333333333s ease-in-out 0.0s forwards; stroke-dasharray:158; stroke-dashoffset:158; }
      .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 2.8333333333333335s forwards; }
    </style>
  </defs>
  <g class="bx">
      <path class="p0" d="M10 8a4 4 0 0 1 8 0l-2 2-2-2 2-2a4 4 0 0 0-6 6l-6 6a1 1 0 0 0 1.4 1.4l6-6" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>