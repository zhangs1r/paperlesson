<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
    <defs>
      <style>
        @keyframes draw { 0% { stroke-dashoffset:100; } 100% { stroke-dashoffset:0; } }
        @keyframes fpop { 0% { opacity:0; transform:scale(0); } 60% { opacity:1; transform:scale(1.2); } 100% { opacity:1; transform:scale(1); } }
        @keyframes bounce {
          0%   { transform:scale(1) rotate(0deg); }
          30%  { transform:scale(1.18) rotate(3deg); }
          55%  { transform:scale(0.92) rotate(-2deg); }
          78%  { transform:scale(1.06) rotate(1deg); }
          100% { transform:scale(1) rotate(0deg); }
        }
      .p0 { animation: draw 1.6666666666666667s ease-in-out 0.0s forwards; stroke-dasharray:100; stroke-dashoffset:100; }
      .p1 { animation: draw 1.6666666666666667s ease-in-out 0.15s forwards; stroke-dasharray:100; stroke-dashoffset:100; }
        .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 2.0166666666666666s forwards; }
      </style>
    </defs>
  <g class="bx">
      <path class="p0" d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p1" d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>