          100% { transform:scale(1) rotate(0deg); }
        }
      .p0 { animation: draw 3.3333333333333335s ease-in-out 0.0s forwards; stroke-dasharray:200; stroke-dashoffset:200; }
      .p1 { animation: draw 0.6s ease-in-out 0.15s forwards; stroke-dasharray:20; stroke-dashoffset:20; }
        .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 3.5333333333333337s forwards; }
      </style>
    </defs>
