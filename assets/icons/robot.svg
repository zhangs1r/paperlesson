<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
    <defs>
      <style>
        @keyframes draw { 0% { stroke-dashoffset:186; } 100% { stroke-dashoffset:0; } }
        @keyframes fpop { 0% { opacity:0; transform:scale(0); } 60% { opacity:1; transform:scale(1.2); } 100% { opacity:1; transform:scale(1); } }
        @keyframes bounce {
          0%   { transform:scale(1) rotate(0deg); }
          30%  { transform:scale(1.18) rotate(3deg); }
          55%  { transform:scale(0.92) rotate(-2deg); }
          78%  { transform:scale(1.06) rotate(1deg); }
          100% { transform:scale(1) rotate(0deg); }
        }
      .p0 { animation: draw 0.6s ease-in-out 0.0s forwards; stroke-dasharray:20; stroke-dashoffset:20; }
      .p1 { animation: draw 3.1s ease-in-out 0.15s forwards; stroke-dasharray:186; stroke-dashoffset:186; }
      .p2 { animation: draw 0.8333333333333334s ease-in-out 0.3s forwards; stroke-dasharray:50; stroke-dashoffset:50; }
      .p3 { animation: draw 0.6s ease-in-out 0.44999999999999996s forwards; stroke-dasharray:24; stroke-dashoffset:24; }
        .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 3.45s forwards; }
      </style>
    </defs>
  <g class="bx">
      <path class="p0" d="M8 12h8" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p1" d="M6 8h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p2" d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p3" d="M9 15v1M15 15v1" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
