<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
  <defs>
    <style>
      @keyframes draw { 0% { stroke-dashoffset:84; } 100% { stroke-dashoffset:0; } }
      @keyframes fpop { 0% { opacity:0; transform:scale(0); } 60% { opacity:1; transform:scale(1.2); } 100% { opacity:1; transform:scale(1); } }
      @keyframes bounce {
        0%   { transform:scale(1) rotate(0deg); }
        30%  { transform:scale(1.18) rotate(3deg); }
        55%  { transform:scale(0.92) rotate(-2deg); }
        78%  { transform:scale(1.06) rotate(1deg); }
        100% { transform:scale(1) rotate(0deg); }
      }
      .p0 { animation: draw 1.4s ease-in-out 0.0s forwards; stroke-dasharray:84; stroke-dashoffset:84; }
      .p1 { animation: draw 1.3666666666666667s ease-in-out 0.15s forwards; stroke-dasharray:82; stroke-dashoffset:82; }
      .p2 { animation: draw 0.6s ease-in-out 0.3s forwards; stroke-dasharray:32; stroke-dashoffset:32; }
      .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.7166666666666666s forwards; }
    </style>
  </defs>
  <g class="bx">
      <path class="p0" d="M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p1" d="M3 20v-2a6 6 0 0 1 6-6 6 6 0 0 1 6 6v2" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p2" d="M19 8l3 3-3 3M21 11h-6" fill="none" stroke="#CC785C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>