<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48">
    <defs>
      <style>
        @keyframes draw { 0% { stroke-dashoffset:90; } 100% { stroke-dashoffset:0; } }
        @keyframes fpop { 0% { opacity:0; transform:scale(0); } 60% { opacity:1; transform:scale(1.2); } 100% { opacity:1; transform:scale(1); } }
        @keyframes bounce {
          0%   { transform:scale(1) rotate(0deg); }
          30%  { transform:scale(1.18) rotate(3deg); }
          55%  { transform:scale(0.92) rotate(-2deg); }
          78%  { transform:scale(1.06) rotate(1deg); }
          100% { transform:scale(1) rotate(0deg); }
        }
      .p0 { animation: draw 1.3666666666666667s ease-in-out 0.0s forwards; stroke-dasharray:82; stroke-dashoffset:82; }
      .p1 { animation: draw 1.5s ease-in-out 0.15s forwards; stroke-dasharray:90; stroke-dashoffset:90; }
        .bx { animation: bounce 0.7s cubic-bezier(0.34,1.56,0.64,1) 1.8499999999999999s forwards; }
      </style>
    </defs>
  <g class="bx">
      <path class="p0" d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="p1" d="M8 18l1 2 2-1-1-2-2 1zM16 14l1 2 2-1-1-2-2 1z" fill="none" stroke="#CC785C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>